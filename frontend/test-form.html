<!DOCTYPE html>
<html>
<head>
    <title>Waitlist Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #0f0f0f; color: #d4d4d4; }
        .form-container { max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: linear-gradient(to right, #f7b91c, #d4a017); color: #1a1a1a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 8px; }
        .success { border: 1px solid #22c55e; }
        .error { border: 1px solid #ef4444; }
    </style>
</head>
<body>
    <h1>Waitlist Form Test</h1>
    
    <div class="form-container">
        <form id="testForm">
            <input type="email" id="email" placeholder="Enter your email" required>
            <button type="submit">Join Waitlist</button>
        </form>
        
        <div id="result" class="result">Test the form submission...</div>
    </div>
    
    <script>
        async function handleSubmit(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');
            const button = event.target.querySelector('button');
            
            resultDiv.innerHTML = '<div class="result">Submitting...</div>';
            button.disabled = true;
            button.textContent = 'Joining...';
            
            try {
                console.log('Testing form submission for:', email);
                
                const response = await fetch('http://localhost:3000/api/waitlist', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });
                
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Success!</h3>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Total Waitlist:</strong> ${data.totalWaitlist}</p>
                            <p><strong>Email Status:</strong> ${data.confirmationSent ? 'Sent' : 'Pending'}</p>
                        </div>
                    `;
                    button.textContent = 'Success!';
                } else {
                    throw new Error(data.error || 'Failed to join waitlist');
                }
                
            } catch (error) {
                console.error('Form submission error:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
                button.disabled = false;
                button.textContent = 'Try Again';
            }
        }
        
        document.getElementById('testForm').addEventListener('submit', handleSubmit);
    </script>
</body>
</html>
